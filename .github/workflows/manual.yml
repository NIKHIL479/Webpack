name: Manual Deploy to IIS (Local Laptop)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

jobs:
  deploy:
    runs-on: windows-latest   # Use self-hosted for your laptop
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # ---------------- FRONTEND ----------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.x'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run webpack
        # React build stays in frontend/wwwroot/build → IIS serves from C:\inetpub\wwwroot/build

      # ---------------- BACKEND ----------------
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend
        working-directory: backend
        run: dotnet restore

      - name: Build backend
        working-directory: backend
        run: dotnet build -c Release --no-restore

      - name: Publish backend to IIS root
        working-directory: backend
        run: dotnet publish -c Release -o "C:\inetpub\wwwroot"

