name: Manual Deploy to IIS (Safe)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # ---------------- FRONTEND ----------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run webpack

      # ---------------- BACKEND ----------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 2️⃣ Publish to TEMP folder
      - name: Publish backend to temp
        working-directory: backend/OhioHealth
        run: |
          dotnet restore
          dotnet publish ./OhioHealth.csproj `
            -c Release `
            -o "C:\inetpub\webpack"

      # 3️⃣ Stop IIS App Pool
      - name: Stop IIS App Pool
        run: |
          Import-Module WebAdministration
          Stop-WebAppPool -Name "rough"

      # 4️⃣ Copy files (EXCEPT web.config)
      - name: Copy files to IIS (preserve web.config)
        run: |
          robocopy "C:\inetpub\webpack" "C:\inetpub\wwwroot" /E /XF web.config
          if ($LASTEXITCODE -ge 8) { exit 1 }

      # 5️⃣ Start IIS App Pool
      - name: Start IIS App Pool
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "rough"
