name: Manual Deploy to IIS (Local Laptop)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      # ---------------- 1️⃣ Checkout ----------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      # ---------------- 2️⃣ Frontend ----------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run webpack

      # ---------------- 3️⃣ Backend ----------------
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ---------------- 4️⃣ Stop IIS App Pool (only if running) ----------------
      - name: Stop IIS App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          $appPool = Get-WebAppPoolState -Name "rough"
          Write-Host "App Pool 'rough' current state: $($appPool.Value)"
      
          if ($appPool.Value -eq "Started") {
              Write-Host "Stopping App Pool 'rough'..."
              Stop-WebAppPool -Name "rough"
          } else {
              Write-Host "App Pool 'rough' is not running. Skipping stop."
          }


      # ---------------- 5️⃣ Publish backend to temp folder ----------------
      - name: Restore and publish backend to temp folder
        working-directory: backend/OhioHealth
        run: |
          dotnet restore
          dotnet publish ./OhioHealth.csproj -c Release -o "C:\inetpub\webpack"

      # ---------------- 6️⃣ Copy files to IIS preserving web.config ----------------
      - name: Deploy to IIS
        shell: powershell
        run: |
          robocopy "C:\inetpub\webpack" "C:\inetpub\wwwroot" /E /XF web.config /MT:16
          $rc = $LASTEXITCODE
          Write-Host "Robocopy Exit Code: $rc"
      
          if ($rc -ge 8) {
              Write-Host "Robocopy failed with exit code $rc"
              exit 1
          } else {
              Write-Host "Robocopy completed successfully (exit code $rc)"
              exit 0
          }



      # ---------------- 7️⃣ Start IIS App Pool ----------------
      - name: Start IIS App Pool
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "rough"
