name: Manual Deploy to IIS (Local Laptop)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      # 1️⃣ Checkout selected branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0   # Ensure all branches are available

      # ---------------- FRONTEND ----------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run webpack

      # ---------------- BACKEND ----------------
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ---------------- STOP IIS APP POOL ----------------
      - name: Stop IIS App Pool
        run: |
          Import-Module WebAdministration
          Stop-WebAppPool -Name "rough"

      - name: Restore and publish backend
        working-directory: backend/OhioHealth
        run: |
          dotnet restore
          dotnet publish ./OhioHealth.csproj -c Release -o "C:\inetpub\wwwroot"
          
      # ---------------- START IIS APP POOL ----------------
      - name: Start IIS App Pool
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "rough"

      # ---------------- OPTIONAL: Restart IIS ----------------
      - name: Restart IIS
        run: iisreset

