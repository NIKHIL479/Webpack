name: Manual Deploy to IIS (Local Laptop)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

jobs:
  deploy:
    runs-on: self-hosted   # Use your self-hosted runner
    defaults:
      run:
        shell: powershell   # Use Windows PowerShell

    steps:
      # 1️⃣ Checkout selected branch
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # ---------------- FRONTEND ----------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'   # Use a valid Node version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run webpack
        # React build will remain in frontend/wwwroot/build
        # IIS should serve from C:\inetpub\wwwroot\build

      # ---------------- BACKEND ----------------
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and publish backend
        working-directory: backend/OhioHealth
        run: |
          dotnet restore
          dotnet publish ./OhioHealth.csproj -c Release -o "C:\inetpub\wwwroot"

      # ---------------- OPTIONAL: Restart IIS ----------------
      - name: Restart IIS
        run: |
          iisreset
